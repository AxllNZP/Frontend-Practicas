<div class="dashboard-container fade-in">

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="navbar-brand">
      <h1>PROGRAMA Z</h1>
    </div>

    <div class="navbar-menu">

      <!-- LINKS -->
      <div class="navbar-links">
        <a routerLink="/dashboard/facturas" routerLinkActive="active">Facturas</a>
        <a routerLink="/dashboard/clientes" routerLinkActive="active">Clientes</a>
        <a routerLink="/dashboard/productos" routerLinkActive="active">Productos</a>

        <a *ngIf="currentUser?.rol === 'admin'"
           routerLink="/dashboard/usuarios"
           routerLinkActive="active">
          Usuarios
        </a>

        <a *ngIf="currentUser?.rol === 'admin'"
           routerLink="/dashboard/monedas"
           routerLinkActive="active">
          Monedas
        </a>
      </div>

      <!-- USER MENU -->
      <div class="user-menu" *ngIf="currentUser">

        <div class="user-info">
          <div class="user-avatar">
            {{ getInitials() }}
          </div>

          <div class="user-details">
            <span class="user-name">
              {{ currentUser.nombreCompleto }}
            </span>

            <span class="role-chip"
                  [class.role-admin]="currentUser.rol === 'admin'"
                  [class.role-vendedor]="currentUser.rol === 'vendedor'">
              {{ currentUser.rol | uppercase }}
            </span>
          </div>
        </div>

        <div class="user-actions">
          <button class="btn-secondary btn-sm" (click)="goToProfile()">
            Perfil
          </button>

          <button class="btn-danger btn-sm" (click)="logout()">
            Salir
          </button>
        </div>

      </div>

    </div>
  </nav>

  <!-- MAIN -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
