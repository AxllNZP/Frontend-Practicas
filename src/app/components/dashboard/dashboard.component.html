<div class="dashboard-container">

  <!-- BARRA DE NAVEGACIÓN -->
  <nav class="navbar">
    <div class="navbar-brand">
      <h1>PROGRAMA Z</h1>
    </div>
    
    <div class="navbar-menu">
      <!-- MENÚ DE NAVEGACIÓN -->
      <div class="navbar-links">
        <!-- FACTURAS: Todos -->
        <a routerLink="/dashboard/facturas" routerLinkActive="active">
          Facturas
        </a>

        <!-- CLIENTES: Todos -->
        <a routerLink="/dashboard/clientes" routerLinkActive="active">
          Clientes
        </a>

        <!-- PRODUCTOS: Todos -->
        <a routerLink="/dashboard/productos" routerLinkActive="active">
          Productos
        </a>

        <!-- USUARIOS: SOLO ADMIN -->
        <a 
          *ngIf="currentUser?.rol === 'admin'"
          routerLink="/dashboard/usuarios" 
          routerLinkActive="active">
          Usuarios
        </a>

        <!-- MONEDAS: SOLO ADMIN -->
        <a 
          *ngIf="currentUser?.rol === 'admin'"
          routerLink="/dashboard/monedas" 
          routerLinkActive="active">
          Monedas
        </a>
      </div>

      <!-- MENÚ DE USUARIO -->
      <div class="user-menu" *ngIf="currentUser">
        
        <!-- INFO DEL USUARIO -->
        <div class="user-info">
          <div class="user-avatar">
            {{ getInitials() }}
          </div>
          
          <div class="user-details">
            <span class="user-name">{{ currentUser.nombreCompleto }}</span>
            
            <!-- BADGE DEL ROL -->
            <span 
              class="badge">
              {{ currentUser.rol | uppercase }}
            </span>
          </div>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="user-actions">
          <button class="btn btn-secondary btn-sm" (click)="goToProfile()">
            Perfil
          </button>
          <button class="btn btn-danger btn-sm" (click)="logout()">
            Salir
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

</div>
