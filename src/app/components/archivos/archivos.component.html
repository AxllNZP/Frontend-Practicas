<!-- src/app/components/archivos/archivos.component.html -->
<div class="container" style="padding:20px; max-width:1200px; margin:auto;">
  <h1>📁 Gestión de Archivos</h1>

  <p style="color:#666; font-size:0.9rem; margin-bottom:20px;">
    Última actualización: {{ lastUpdated | date:'medium' }}
  </p>

  <div style="margin-bottom:24px; border:1px solid #ddd; padding:16px; border-radius:8px; background:#f9f9f9;">
    <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
    <button 
      (click)="onUpload()" 
      [disabled]="uploading || !archivoSeleccionado" 
      style="margin-left:8px; padding:8px 16px; background:#667eea; color:white; border:none; border-radius:6px; cursor:pointer;">
      {{ uploading ? 'Subiendo...' : 'Subir Archivo' }}
    </button>
  </div>

  <table style="width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <thead>
      <tr style="background:#667eea; color:white;">
        <th style="padding:12px; text-align:left;">ID</th>
        <th style="padding:12px; text-align:left;">Nombre</th>
        <th style="padding:12px; text-align:left;">Tipo</th>
        <th style="padding:12px; text-align:left;">Tamaño</th>
        <th style="padding:12px; text-align:center;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of archivos" style="border-bottom:1px solid #eee;">
        <td style="padding:12px;">{{ a.id }}</td>
        <td style="padding:12px; font-weight:500;">{{ a.nombre }}</td>
        <td style="padding:12px;">{{ a.tipo }}</td>
        <td style="padding:12px;">{{ a.tamanio | number }} bytes</td>
        <td style="padding:12px; text-align:center;">
          <button 
            (click)="download(a)" 
            style="margin-right:8px; padding:6px 12px; background:#27ae60; color:white; border:none; border-radius:4px; cursor:pointer;">
            ⬇️ Descargar
          </button>
          <button 
            (click)="confirmDelete(a)" 
            style="padding:6px 12px; background:#e74c3c; color:white; border:none; border-radius:4px; cursor:pointer;">
            🗑️ Borrar
          </button>
        </td>
      </tr>
      
      <tr *ngIf="archivos.length === 0">
        <td colspan="5" style="padding:40px; text-align:center; color:#888; font-style:italic;">
          📭 No hay archivos disponibles en el servidor
        </td>
      </tr>
    </tbody>
  </table>
</div>
