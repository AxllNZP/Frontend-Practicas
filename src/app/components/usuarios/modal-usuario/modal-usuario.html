<!-- src/app/components/modal-usuario/modal-usuario.component.html -->

<!--
  📖 TEMPLATE DEL MODAL DE USUARIO
  
  Este es un componente reutilizable que puede ser usado para:
  - Crear nuevos usuarios (modoEdicion = false)
  - Editar usuarios existentes (modoEdicion = true)
  
  MEJORAS vs. versión inline:
  ✅ Código más limpio y organizado
  ✅ Fácil de mantener
  ✅ Reutilizable en múltiples contextos
  ✅ Separación clara de responsabilidades
-->

<div 
  class="modal-overlay" 
  *ngIf="isOpen"
  (click)="cerrarModal()">
  
  <div 
    class="modal-content" 
    (click)="onModalContentClick($event)">
    
    <!-- ========================================
         HEADER DEL MODAL
         ======================================== -->
    <div class="modal-header">
      <h2>{{ getTitulo() }}</h2>
      <button 
        class="btn-close" 
        (click)="cerrarModal()"
        type="button"
        aria-label="Cerrar modal">
        ✖
      </button>
    </div>

    <!-- ========================================
         BODY DEL MODAL - FORMULARIO
         ======================================== -->
    <div class="modal-body">
      <div class="form-grid">
        
        <!-- Campo: Nombre de Usuario -->
        <div class="form-group">
          <label for="nombreUsuario">
            Usuario *
          </label>
          <input 
            id="nombreUsuario"
            type="text"
            [(ngModel)]="nombreUsuario"
            class="form-control"
            placeholder="Ej: juan.perez"
            [disabled]="modoEdicion"
            autocomplete="username">
          <small class="form-hint" *ngIf="modoEdicion">
            El nombre de usuario no puede modificarse
          </small>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <label for="clave">
            Contraseña *
          </label>
          <input 
            id="clave"
            type="password"
            [(ngModel)]="clave"
            class="form-control"
            placeholder="••••••••"
            autocomplete="new-password">
          <small class="form-hint" *ngIf="modoEdicion">
            Dejar en blanco para mantener la actual
          </small>
        </div>

        <!-- Campo: Nombre Completo -->
        <div class="form-group full-width">
          <label for="nombreCompleto">
            Nombre Completo *
          </label>
          <input 
            id="nombreCompleto"
            type="text"
            [(ngModel)]="nombreCompleto"
            class="form-control"
            placeholder="Ej: Juan Pérez García"
            autocomplete="name">
        </div>

        <!-- Campo: Email -->
        <div class="form-group full-width">
          <label for="email">
            Email
          </label>
          <input 
            id="email"
            type="email"
            [(ngModel)]="email"
            class="form-control"
            placeholder="Ej: juan.perez@empresa.com"
            autocomplete="email">
          <small class="form-hint">
            Opcional
          </small>
        </div>

        <!-- Campo: Rol -->
        <div class="form-group">
          <label for="rol">
            Rol
          </label>
          <select 
            id="rol"
            [(ngModel)]="rol"
            class="form-control">
            <option value="admin">👑 ADMIN</option>
            <option value="vendedor">💼 VENDEDOR</option>
          </select>
          <small class="form-hint">
            Define los permisos del usuario
          </small>
        </div>

        <!-- Campo: Estado -->
        <div class="form-group">
          <label for="estado">
            Estado *
          </label>
          <select 
            id="estado"
            [(ngModel)]="estado"
            class="form-control">
            <option value="activo">✅ Activo</option>
            <option value="inactivo">⛔ Inactivo</option>
          </select>
          <small class="form-hint">
            Usuarios inactivos no pueden acceder
          </small>
        </div>
        
      </div>
    </div>

    <!-- ========================================
         FOOTER DEL MODAL - BOTONES
         ======================================== -->
    <div class="modal-footer">
      <button 
        class="btn-cancelar" 
        (click)="cerrarModal()"
        type="button">
        Cancelar
      </button>
      <button 
        class="btn-guardar" 
        (click)="guardarUsuario()"
        type="button">
        {{ getTextoBotonGuardar() }}
      </button>
    </div>

  </div>
</div>
