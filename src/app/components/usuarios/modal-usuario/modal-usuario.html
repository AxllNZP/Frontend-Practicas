<!-- modal-usuario.component.html -->
<div class="modal-overlay" *ngIf="isOpen" (click)="cerrarModal()">
  
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <!-- HEADER -->
    <div class="modal-header">
      <div class="title-section">
        <div class="icon-badge user-badge">
          {{ modoEdicion ? '👤' : '👋' }}
        </div>
        <div>
          <h2>{{ getTitulo() }}</h2>
          <p class="subtitle">{{ modoEdicion ? 'Actualiza los datos de acceso' : 'Registra un nuevo miembro del equipo' }}</p>
        </div>
      </div>
      <button class="btn-icon-close" (click)="cerrarModal()" title="Cerrar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- BODY -->
    <div class="modal-body">
      <div class="form-grid">
        
        <!-- Nombre Completo (Full Width) -->
        <div class="form-group full-width">
          <label for="nombreCompleto">Nombre Completo <span class="required">*</span></label>
          <div class="input-wrapper">
            <input id="nombreCompleto" type="text" class="form-input" 
                   [(ngModel)]="nombreCompleto" placeholder="Ej: Juan Pérez García" autocomplete="name">
          </div>
        </div>

        <!-- Usuario -->
        <div class="form-group">
          <label for="nombreUsuario">Usuario <span class="required">*</span></label>
          <div class="input-wrapper">
            <span class="input-prefix">@</span>
            <input id="nombreUsuario" type="text" class="form-input has-prefix" 
                   [(ngModel)]="nombreUsuario" placeholder="juan.perez"
                   [disabled]="modoEdicion" autocomplete="username">
          </div>
          <small class="helper-text" *ngIf="modoEdicion">No modificable</small>
        </div>

        <!-- Rol -->
        <div class="form-group">
          <label for="rol">Rol</label>
          <div class="select-wrapper">
            <select id="rol" class="form-select" [(ngModel)]="rol">
              <option value="admin">👑 ADMIN</option>
              <option value="vendedor">💼 VENDEDOR</option>
            </select>
          </div>
          <small class="helper-text">Permisos del sistema</small>
        </div>

        <!-- Email (Full Width) -->
        <div class="form-group full-width">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input id="email" type="email" class="form-input" 
                   [(ngModel)]="email" placeholder="juan.perez@empresa.com" autocomplete="email">
          </div>
          <small class="helper-text">Opcional</small>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="clave">Contraseña {{ modoEdicion ? '' : '*' }}</label>
          <div class="input-wrapper">
            <input id="clave" type="password" class="form-input" 
                   [(ngModel)]="clave" placeholder="••••••••" autocomplete="new-password">
          </div>
          <small class="helper-text" *ngIf="modoEdicion">Dejar vacío para mantener actual</small>
        </div>

        <!-- Estado -->
        <div class="form-group">
          <label for="estado">Estado <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="estado" class="form-select" [(ngModel)]="estado">
              <option value="activo">✅ Activo</option>
              <option value="inactivo">⛔ Inactivo</option>
            </select>
          </div>
        </div>
        
      </div>
    </div>

    <!-- FOOTER -->
    <div class="modal-footer">
      <button class="btn-secondary" (click)="cerrarModal()" [disabled]="guardando">
        Cancelar
      </button>
      
      <button class="btn-primary" (click)="guardarUsuario()" [disabled]="guardando">
        <span *ngIf="guardando" class="spinner-sm"></span>
        {{ guardando ? 'Guardando...' : getTextoBotonGuardar() }}
      </button>
    </div>

  </div>
</div>
