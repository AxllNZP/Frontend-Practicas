<div class="modal-overlay" *ngIf="isOpen" (click)="cerrarModal()">

  <div class="modal-container" (click)="$event.stopPropagation()">

    <!-- HEADER -->
    <div class="modal-header">
      <div class="title-section">
        <div class="icon-badge">👥</div>
        <div>
          <h2>Reporte de Usuarios</h2>
          <p class="subtitle">Genera reportes de facturación por usuario y rango de fechas</p>
        </div>
      </div>

      <button class="btn-icon-close" (click)="cerrarModal()">
        ✖
      </button>
    </div>

    <!-- BODY -->
    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">
          <label>Usuario</label>
          <select class="form-select" [(ngModel)]="usuarioSeleccionado">
            <option [ngValue]="undefined">Todos</option>
            <option *ngFor="let u of usuarios" [ngValue]="u">
              {{ u.nombreCompleto }} ({{ u.rol }})
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Fecha Inicio</label>
          <input type="date" class="form-input" [(ngModel)]="fechaInicio">
        </div>

        <div class="form-group">
          <label>Fecha Fin</label>
          <input type="date" class="form-input" [(ngModel)]="fechaFin">
        </div>

        <div class="form-group full-width">
          <button class="btn-primary" (click)="buscar()">
            Buscar
          </button>
        </div>

      </div>

      <!-- PREVISUALIZACIÓN -->
      <div *ngIf="reporte.length > 0" class="preview-table">

        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Facturas</th>
              <th>Subtotal</th>
              <th>IGV</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let r of reporte">
              <td>{{ r.nombreCompleto }}</td>
              <td>{{ r.rol }}</td>
              <td>{{ r.estado }}</td>
              <td>{{ r.totalFacturas }}</td>
              <td>{{ r.totalSubtotal }}</td>
              <td>{{ r.totalIgv }}</td>
              <td>{{ r.totalVendido }}</td>
            </tr>
          </tbody>
        </table>

        <div class="export-buttons">
          <button class="btn-secondary" (click)="exportarPdf()">PDF</button>
          <button class="btn-primary" (click)="exportarExcel()">Excel</button>
        </div>

      </div>

    </div>

  </div>
</div>
