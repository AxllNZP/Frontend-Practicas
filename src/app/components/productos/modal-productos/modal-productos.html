<!-- El overlay tiene una directiva de animación fade para suavidad -->
<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  
  <div class="modal-container" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="modal-header">
      <div class="title-section">
        <div class="icon-badge">
          {{ modoEdicion ? '✏️' : '✨' }}
        </div>
        <div>
          <h2>{{ modoEdicion ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
          <p class="subtitle">Completa la información del inventario</p>
        </div>
      </div>
      <button class="btn-icon-close" (click)="onCerrar()" title="Cerrar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <div class="form-grid">
        
        <!-- Código -->
        <div class="form-group">
          <label for="codigo">Código <span class="required">*</span></label>
          <div class="input-wrapper">
            <input id="codigo" type="text" class="form-input" 
                   [(ngModel)]="producto.codigo" placeholder="Ej. PRD-001">
          </div>
        </div>

        <!-- Nombre -->
        <div class="form-group">
          <label for="nombre">Nombre <span class="required">*</span></label>
          <div class="input-wrapper">
            <input id="nombre" type="text" class="form-input" 
                   [(ngModel)]="producto.nombre" placeholder="Nombre del producto">
          </div>
        </div>

        <!-- Descripción (Full Width) -->
        <div class="form-group full-width">
          <label for="descripcion">Descripción</label>
          <div class="input-wrapper">
            <textarea id="descripcion" rows="2" class="form-input" 
                      [(ngModel)]="producto.descripcion" placeholder="Detalles adicionales..."></textarea>
          </div>
        </div>

        <!-- Precio -->
        <div class="form-group">
          <label for="precio">Precio <span class="required">*</span></label>
          <div class="input-wrapper price-wrapper">
            <span class="currency-symbol">S/</span>
            <input id="precio" type="number" class="form-input has-prefix" 
                   [(ngModel)]="producto.precio" placeholder="0.00">
          </div>
        </div>

        <!-- Stock -->
        <div class="form-group">
          <label for="stock">Stock <span class="required">*</span></label>
          <div class="input-wrapper">
            <input id="stock" type="number" class="form-input" 
                   [(ngModel)]="producto.stock" placeholder="0">
          </div>
        </div>

        <!-- Estado -->
        <div class="form-group">
          <label for="estado">Estado <span class="required">*</span></label>
          <div class="select-wrapper">
            <select id="estado" class="form-select" [(ngModel)]="producto.estado">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn-secondary" (click)="onCerrar()" [disabled]="guardando">
        Cancelar
      </button>
      
      <button class="btn-primary" (click)="onGuardar()" [disabled]="guardando">
        <span *ngIf="guardando" class="spinner-sm"></span>
        {{ guardando ? 'Guardando...' : (modoEdicion ? 'Actualizar Cambios' : 'Crear Producto') }}
      </button>
    </div>

  </div>
</div>
