<div class="modal-overlay" *ngIf="mostrar" (click)="onCerrar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ modoEdicion ? '✏️ Editar Producto' : '➕ Nuevo Producto' }}</h2>
      <button class="btn-close" (click)="onCerrar()">✖</button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Código *</label>
          <input class="form-control" [(ngModel)]="producto.codigo">
        </div>

        <div class="form-group">
          <label>Nombre *</label>
          <input class="form-control" [(ngModel)]="producto.nombre">
        </div>

        <div class="form-group full-width">
          <label>Descripción</label>
          <input class="form-control" [(ngModel)]="producto.descripcion">
        </div>

        <div class="form-group">
          <label>Precio *</label>
          <input type="number" class="form-control" [(ngModel)]="producto.precio">
        </div>

        <div class="form-group">
          <label>Stock *</label>
          <input type="number" class="form-control" [(ngModel)]="producto.stock">
        </div>

        <div class="form-group">
          <label>Estado *</label>
          <select class="form-control" [(ngModel)]="producto.estado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancelar" (click)="onCerrar()">Cancelar</button>
      <button class="btn-guardar" (click)="onGuardar()">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>
