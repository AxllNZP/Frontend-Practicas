<div class="profile-container fade-in" *ngIf="user">

  <div class="profile-card">

    <div class="avatar">
      {{ getInitials() }}
    </div>

    <h2 class="profile-name">
      {{ user.nombreCompleto }}
    </h2>

    <span class="role-chip"
          [class.role-admin]="user.rol === 'admin'"
          [class.role-vendedor]="user.rol === 'vendedor'">
      {{ user.rol | uppercase }}
    </span>

    <div class="info">

      <div class="info-item">
        <span class="label">Usuario</span>
        <span class="value">@{{ user.nombreUsuario }}</span>
      </div>

      <div class="info-item">
        <span class="label">Email</span>
        <span class="value">{{ user.email }}</span>
      </div>

    </div>

  </div>

</div>
