<div class="container">

  <div class="header">
    <div class="header-content">
      <h1>💱 Gestión de Monedas</h1>
      <button class="btn-crear" (click)="abrirCrear()">➕ Nueva Moneda</button>
    </div>

    <p class="last-update">
      Última actualización:
      <span *ngIf="lastUpdated">{{ lastUpdated | date:'medium' }}</span>
      <span *ngIf="!lastUpdated">Cargando...</span>
    </p>
  </div>

  <div *ngIf="cargando" class="loading">
    ⏳ Cargando monedas...
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Símbolo</th>
          <th>Código</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let m of monedas">
          <td>{{ m.idMoneda }}</td>
          <td>{{ m.nombre }}</td>
          <td>{{ m.simbolo }}</td>
          <td><strong>{{ m.codigo }}</strong></td>
          <td>
            <button class="btn-editar" (click)="abrirEditar(m)">✏️</button>
            <button class="btn-eliminar" (click)="eliminar(m)">🗑️</button>
          </td>
        </tr>

        <tr *ngIf="monedas.length === 0 && !cargando">
          <td colspan="5" class="no-data">📭 No hay monedas registradas</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>


<app-modal-moneda
  [isOpen]="mostrarModal"
  [modoEdicion]="modoEdicion"
  [monedaEditar]="monedaParaEditar"
  [guardando]="guardando"
  (cerrar)="onModalCerrar()"
  (guardar)="onModalGuardar($event)">
</app-modal-moneda>
