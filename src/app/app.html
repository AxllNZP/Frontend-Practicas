// src/app/app.html
<div style="padding: 30px; border: 2px solid #ccc; border-radius: 10px; text-align: center; margin: 50px;">
  <h1>Subida de Archivos (PDF)</h1>
  
  <input type="file" 
         (change)="onFileSelected($event)" 
         accept="application/pdf" 
         style="margin-bottom: 20px;">

  <br>

  <button [disabled]="!archivoSeleccionado" 
          (click)="onUpload()"
          style="background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
    Enviar a Spring Boot
  </button>
  
  <p *ngIf="archivoSeleccionado">
    Seleccionado: <strong>{{ archivoSeleccionado.name }}</strong>
  </p>
</div>
