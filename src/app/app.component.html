// src/app/app.component.html
<div class="container" style="padding:20px; max-width:900px; margin:auto;">
  <h1>Gestión de Archivos</h1>

  <p style="color:#666; font-size:0.9rem;">
    Última actualización: {{ lastUpdated | date:'mediumTime' }}
  </p>

  <div style="margin-bottom:16px; border:1px solid #ddd; padding:12px; border-radius:8px;">
    <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
    <button (click)="onUpload()" [disabled]="uploading || !archivoSeleccionado" style="margin-left:8px;">
      {{ uploading ? 'Subiendo...' : 'Subir' }}
    </button>
  </div>

  <table style="width:100%; border-collapse:collapse;">
    <thead>
      <tr style="text-align:left; border-bottom:2px solid #ccc; background-color: #f9f9f9;">
        <th style="padding:8px;">ID</th>
        <th style="padding:8px;">Nombre</th>
        <th style="padding:8px;">Tipo</th>
        <th style="padding:8px;">Tamaño (bytes)</th>
        <th style="padding:8px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of archivos" style="border-bottom:1px solid #eee;">
        <td style="padding:8px;">{{ a.id }}</td>
        <td style="padding:8px;">{{ a.nombre }}</td>
        <td style="padding:8px;">{{ a.tipo }}</td>
        <td style="padding:8px;">{{ a.tamanio | number }}</td>
        <td style="padding:8px;">
          <button (click)="download(a)" style="margin-right:8px; cursor:pointer;">Descargar</button>
          <button (click)="confirmDelete(a)" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Borrar</button>
        </td>
      </tr>
      
      <tr *ngIf="archivos.length === 0">
        <td colspan="5" style="padding:20px; text-align:center; color: #888;">
          No hay archivos disponibles en el servidor.
        </td>
      </tr>
    </tbody>
  </table>
</div>
